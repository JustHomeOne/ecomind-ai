name: Deploy EcoMind AI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and routing algorithm
        run: npm ci && npm run check
      - name: Prepare public frontend
        run: |
          mkdir public-site
          cp dist/*.html dist/*.js dist/*.css dist/*.svg dist/*.txt public-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
